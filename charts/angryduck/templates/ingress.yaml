{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "angryduck.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "angryduck.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Exact
            backend:
              service:
                name: {{ include "angryduck.controllerName" . }}
                port:
                  name: http
{{- end }}

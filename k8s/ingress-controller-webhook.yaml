apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angryduck-webhook
  namespace: angryduck
  labels:
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: controller
spec:
  ingressClassName: nginx
  rules:
    - host: angryduck.example.com
      http:
        paths:
          - path: /webhook/preheat
            pathType: Exact
            backend:
              service:
                name: angryduck-controller
                port:
                  number: 8080

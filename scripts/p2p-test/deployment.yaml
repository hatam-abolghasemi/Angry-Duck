apiVersion: apps/v1
kind: Deployment
metadata:
  name: angryduck-p2p-test
  namespace: delivery-core-stg
  labels:
    app: angryduck-p2p-test
    purpose: angryduck-p2p-verification
spec:
  replicas: 20
  selector:
    matchLabels:
      app: angryduck-p2p-test
  template:
    metadata:
      labels:
        app: angryduck-p2p-test
    spec:
      imagePullSecrets:
        - name: gitlab-docker-registry
      # Deliberately excludes the 5 nodes the preheat webhook already
      # seeded (worker8/10/9/12/1). Every pull that succeeds on the
      # remaining nodes can therefore only be attributed to a peer
      # transfer, not to already having the image from preheat.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - sahand-k8s-stg-worker8-104037
                      - sahand-k8s-stg-worker10-104040
                      - sahand-k8s-stg-worker9-104038
                      - sahand-k8s-stg-worker12-104042
                      - sahand-k8s-stg-worker1-104029
      # Spread as widely as possible across whatever's left, so this
      # produces many distinct hit/miss data points instead of piling
      # onto a couple of nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: angryduck-p2p-test
      containers:
        - name: app
          image: registry.internal-registry.example.com/snappfood/express/snappfood-express-server/stage:v9016
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      # No probes on purpose: we only care whether the IMAGE PULL
      # succeeds (crictl/mirror/P2P), not whether the app boots cleanly
      # without its real config/secrets/env — a probe failure or
      # crashloop after a successful pull would only add noise to what
      # we're actually trying to observe.
      tolerations:
        - operator: Exists

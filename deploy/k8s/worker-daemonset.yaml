apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: angryduck-worker
  namespace: angryduck
  labels:
    app: angryduck-worker
spec:
  selector:
    matchLabels:
      app: angryduck-worker
  template:
    metadata:
      labels:
        app: angryduck-worker
    spec:
      # hostNetwork so the worker can reach node-exporter at localhost:9100
      # and so its own pod IP equals the node's IP for SELF_ADDRESS.
      hostNetwork: true
      hostPID: true
      # REQUIRED alongside hostNetwork: true — without this, the pod falls
      # back to the node's own /etc/resolv.conf and cannot resolve
      # cluster-internal Service DNS names like
      # angryduck-controller.angryduck.svc.cluster.local.
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: gitlab-docker-registry
      containers:
        - name: worker
          image: registry.internal-registry.example.com/devops/generic/angry-duck-worker:1.0.7
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SELF_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
              # A bare IP is fine here: the worker binary appends its own
              # WORKER_LISTEN_ADDR port automatically if SELF_ADDRESS has
              # no ":" in it.
          envFrom:
            - configMapRef:
                name: angryduck-config
          ports:
            - containerPort: 18081
              name: http
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
            - name: registry-creds
              mountPath: /etc/angryduck/registry-creds
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            privileged: true # required to talk to the node's containerd socket
      volumes:
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        # Same secret already used above for imagePullSecrets (kubelet's
        # own pull of the worker's own image) — reused here so the worker
        # process itself can read it too, since the worker's own preheat
        # pulls (`ctr images pull`) bypass kubelet's CRI plumbing entirely
        # and get none of the imagePullSecrets credentials otherwise. Make
        # sure this secret's "auths" map includes every registry Angry
        # Duck might be asked to preheat from, not just the one your own
        # images live in — dockerconfigjson supports multiple registries
        # in one secret natively.
        - name: registry-creds
          secret:
            secretName: gitlab-registry-pull
      tolerations:
        - operator: Exists # run on every node, including tainted ones

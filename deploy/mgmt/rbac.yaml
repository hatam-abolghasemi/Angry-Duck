apiVersion: v1
kind: ServiceAccount
metadata:
  name: angryduck-worker
  namespace: angryduck
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: angryduck-worker-podwatch
rules:
  # get/list only — pod-watch never creates, deletes, or evicts anything;
  # it only reads container status to find stuck pulls. Cluster-wide
  # (not namespaced) because the pod that needs rescuing can be in any
  # namespace (config-guard, kube-system, an app namespace, ...) and
  # pod-watch has no way to know which ones in advance. It still only
  # ever looks at pods on its OWN node — enforced by the fieldSelector in
  # the request, not by RBAC, since Kubernetes RBAC has no per-node scope
  # for pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: angryduck-worker-podwatch
subjects:
  - kind: ServiceAccount
    name: angryduck-worker
    namespace: angryduck
roleRef:
  kind: ClusterRole
  name: angryduck-worker-podwatch
  apiGroup: rbac.authorization.k8s.io

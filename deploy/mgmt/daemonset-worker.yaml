apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: angryduck-worker
  namespace: angryduck
  labels:
    app.kubernetes.io/env: mgmt
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/env: mgmt
      app.kubernetes.io/name: angryduck
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/env: mgmt
        app.kubernetes.io/name: angryduck
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: angryduck-worker
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: registry-pull-secret
      containers:
        - name: worker
          image: registry.example.com/devops/generic/angry-duck-worker:1.5.0
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SELF_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: angryduck-config
          ports:
            - containerPort: 18081
              name: http
          volumeMounts:
            - name: registry-creds
              mountPath: /etc/angryduck/registry-creds
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 192Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop: ["ALL"]
              add: ["SYS_CHROOT", "SYS_PTRACE"]
      volumes:
        - name: registry-creds
          secret:
            secretName: angryduck-registry-creds
      tolerations:
        - operator: Exists

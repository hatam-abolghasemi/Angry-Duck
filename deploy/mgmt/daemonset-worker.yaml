apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: angryduck-worker
  namespace: angryduck
  labels:
    app.kubernetes.io/env: mgmt
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/env: mgmt
      app.kubernetes.io/name: angryduck
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/env: mgmt
        app.kubernetes.io/name: angryduck
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: angryduck-worker
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: gitlab-docker-registry
      containers:
        - name: worker
          image: registry.example.com/devops/generic/angry-duck-worker:1.8.4
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SELF_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: angryduck-config
          ports:
            - containerPort: 18081
              name: http
          volumeMounts:
            - name: registry-creds
              mountPath: /etc/angryduck/registry-creds
              readOnly: true
            - name: rescue-token
              mountPath: /etc/angryduck/rescue-token
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 192Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop: ["ALL"]
              # SYS_CHROOT, SYS_PTRACE: run the node's crictl/ctr/tar
              # (see HOST_ROOT). The rest are for rescue's snapshot
              # shipping, which copies overlayfs snapshot directories with
              # the node's tar: reading any file (DAC_READ_SEARCH), writing
              # it back with its owner, mode and file capabilities (CHOWN,
              # DAC_OVERRIDE, FOWNER, FSETID, SETFCAP), recreating deleted-
              # file markers (MKNOD) and trusted.overlay.* attributes
              # (SYS_ADMIN). The worker can already drive containerd, which
              # is root-equivalent on the node, so this adds no new level
              # of trust.
              add: ["SYS_CHROOT", "SYS_PTRACE", "DAC_READ_SEARCH", "DAC_OVERRIDE", "CHOWN", "FOWNER", "FSETID", "SETFCAP", "MKNOD", "SYS_ADMIN"]
      volumes:
        - name: registry-creds
          secret:
            secretName: gitlab-registry-pull
        # Guards /rescue and /blobs/*. optional: without it the worker still
        # starts, but never serves or receives blobs.
        - name: rescue-token
          secret:
            secretName: angryduck-rescue-token
            optional: true
      tolerations:
        - operator: Exists

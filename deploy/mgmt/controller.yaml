apiVersion: apps/v1
kind: Deployment
metadata:
  name: angryduck-controller
  namespace: angryduck
  labels:
    app: angryduck-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angryduck-controller
  template:
    metadata:
      labels:
        app: angryduck-controller
    spec:
      imagePullSecrets:
        - name: gitlab-docker-registry
      containers:
        - name: controller
          image: registry.internal-registry.example.com/devops/generic/angry-duck-controller:1.4.0
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: angryduck-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # The controller only ever holds small, bounded per-node
            # state (a fresh/utilization record, a set of repo names, and
            # a set of exact image references -- tens of short strings
            # per node), replaced wholesale on every report, never
            # accumulated. Even at fleet sizes far beyond today's, this
            # stays a few hundred KB, not something that needs a large
            # memory budget.
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 150m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: angryduck-controller
  namespace: angryduck
spec:
  selector:
    app: angryduck-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: angryduck-worker
  namespace: angryduck
  labels:
    app: angryduck-worker
spec:
  selector:
    matchLabels:
      app: angryduck-worker
  template:
    metadata:
      labels:
        app: angryduck-worker
    spec:
      serviceAccountName: angryduck-worker
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: gitlab-docker-registry
      containers:
        - name: worker
          image: registry.internal-registry.example.com/devops/generic/angry-duck-worker:1.4.0
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SELF_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Shared by every worker; a rescue import presents this to
            # the source node's /rescue-export. Optional and soft-fail by
            # design (see cmd/worker/main.go): without it, rescue still
            # runs and still counts/logs stuck pulls, it just can't fix
            # anything -- unlike the old mirror, a missing token here
            # never makes a normal pull silently go wrong.
            - name: RESCUE_PEER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: angryduck-rescue
                  key: token
                  optional: true
          envFrom:
            - configMapRef:
                name: angryduck-config
          ports:
            - containerPort: 18081
              name: http
          volumeMounts:
            # No containerd socket or binary mounts: crictl/ctr run
            # chrooted into /proc/1/root and see the node's own socket.
            - name: registry-creds
              mountPath: /etc/angryduck/registry-creds
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # Idle usage: the worker binary itself is ~6 MiB resident; the
            # periodic `crictl images`/`crictl ps` calls (~20 MiB, a child
            # in this cgroup, gone the instant the call returns) and an
            # occasional preheat `crictl pull` (~25 MiB) are the only
            # other regular consumers. Nothing here holds unbounded state:
            # the largest thing kept resident is the local image listing
            # cache (Inventory), a few tens of short strings -- well under
            # a megabyte even on a node with 100+ local images.
            # Limits cover the rare case: at most ONE rescue export and
            # ONE rescue import in flight on this node at a time (rescue
            # is a one-shot repair, not a throughput mechanism -- see
            # RESCUE_MAX_CONCURRENT_EXPORTS), each peaking at ~30-35 MiB
            # while it runs. Worst case ~= worker 6 + 1 export 35 +
            # 1 import 35 + crictl listing 20 + preheat pull 25 ~= 121 MiB.
            # CPU is bursty by nature (short subprocess execs), never
            # sustained, so the limit only needs to cover one of those
            # bursts, not throughput.
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            privileged: true
      volumes:
        - name: registry-creds
          secret:
            secretName: gitlab-registry-pull
      tolerations:
        - operator: Exists

apiVersion: v1
kind: ServiceAccount
metadata:
  name: angryduck-worker
  namespace: angryduck
  labels:
    app.kubernetes.io/env: mgmt
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: worker
# The worker makes no Kubernetes API calls at all -- no RBAC is bound to
# this identity. (Finding pods stuck in ImagePullBackOff is the
# controller's job; see serviceaccount-controller.yaml.) Keeping the
# identity itself is still useful for NetworkPolicy/OPA/audit-log selection
# by service account name, but nothing here needs the token, so don't mount
# one.
automountServiceAccountToken: false

apiVersion: apps/v1
kind: Deployment
metadata:
  name: angryduck-controller
  namespace: angryduck
  labels:
    app.kubernetes.io/env: stg
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/env: stg
      app.kubernetes.io/name: angryduck
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/env: stg
        app.kubernetes.io/name: angryduck
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: angryduck-controller
      imagePullSecrets:
        - name: gitlab-docker-registry
      containers:
        - name: controller
          image: registry.example.com/devops/generic/angry-duck-controller:1.8.5
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: angryduck-config
          volumeMounts:
            # Same pull secret as the workers: the controller reads pushed
            # images' manifests (a few KB) to pick seeds by layers.
            - name: registry-creds
              mountPath: /etc/angryduck/registry-creds
              readOnly: true
            - name: rescue-token
              mountPath: /etc/angryduck/rescue-token
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # Measured with 150 nodes (1.8.4): ~13m CPU, 22Mi steady, 26Mi
            # right after a restart, when every worker resends its full
            # layer inventory. Memory grows roughly linearly with nodes.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 64Mi
      volumes:
        - name: registry-creds
          secret:
            secretName: gitlab-registry-pull
            optional: true
        # Shared with the workers. optional: without it the pod still
        # starts and rescue logs a warning and stays off.
        - name: rescue-token
          secret:
            secretName: angryduck-rescue-token
            optional: true

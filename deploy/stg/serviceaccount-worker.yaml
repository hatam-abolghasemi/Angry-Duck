apiVersion: v1
kind: ServiceAccount
metadata:
  name: angryduck-worker
  namespace: angryduck
  labels:
    app.kubernetes.io/env: stg
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: worker
# The worker's only Kubernetes API call: on shutdown, get its own
# DaemonSet. Gone or being deleted means an uninstall, and the worker then
# cleans up the node (hosts.toml, pins, temporary snapshots, state files).
# Otherwise it's a rollout or an eviction, and the next pod picks up.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: angryduck-worker
  namespace: angryduck
  labels:
    app.kubernetes.io/env: stg
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: worker
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["angryduck-worker"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: angryduck-worker
  namespace: angryduck
  labels:
    app.kubernetes.io/env: stg
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: angryduck-worker
subjects:
  - kind: ServiceAccount
    name: angryduck-worker
    namespace: angryduck

apiVersion: v1
kind: ConfigMap
metadata:
  name: angryduck-config
  namespace: angryduck
data:
  # debug shows every per-image GC decision and the raw disk-utilization
  # math; info shows normal events without that volume.
  LOG_LEVEL: "info"
  CONTROLLER_LISTEN_ADDR: ":8080"
  WORKER_STALE_AFTER_S: "30"
  TARGET_TTL_S: "120"
  RANK_INTERVAL_S: "10"
  # Exactly how many nodes preheat per push (it no longer spreads to the
  # whole fleet). Everyone else gets the image from these on demand.
  RANK_TOP_N: "5"
  # Prefer a node that already has some older tag of the same repo locally
  # over an emptier node that doesn't — most layers are usually shared
  # between tags of the same repo, so that pull is typically much cheaper
  # than a cold one. Nodes are still ranked by lowest utilization within
  # each of those two groups. Set to "false" to fall back to plain
  # utilization-only ranking if this ever needs a quick rollback.
  RANK_PREFER_IMAGE_LOCALITY: "true"
  # Node names in this cluster follow "sahand-k8s-stg-master{N}-...", so
  # "master" alone is enough; "control-plane" is included too in case the
  # taint/role naming ever changes without the node name changing.
  RANK_EXCLUDE_NODE_SUBSTRINGS: "master,control-plane"

  WORKER_LISTEN_ADDR: ":18081"
  NODE_EXPORTER_URL: "http://localhost:9100/metrics"
  CONTROLLER_URL: "http://angryduck-controller.angryduck.svc.cluster.local:8080"
  REPORT_INTERVAL_S: "15"
  GC_CHECK_INTERVAL_S: "60"
  GC_MISS_THRESHOLD: "5"
  GC_GRACE_PERIOD_S: "60"
  # Logs GC decisions without deleting anything until explicitly turned off.
  # Only set to "false" after reviewing dry-run logs on real nodes.
  GC_DRY_RUN: "false"
  # pause is never observed as "running" by crictl (it backs the pod
  # sandbox, not a regular container) so without this it would sit at its
  # miss threshold and get removed/re-pulled forever. node-exporter is
  # excluded too since it commonly runs outside the normal container
  # lifecycle GC observes.
  GC_EXCLUDE_IMAGE_SUBSTRINGS: "repo-sahand.internal-dev.example.com/pause:3.10"
  # crictl lists every running container's image in one call; ctr needs one
  # subprocess per container, which is what was pushing worker pods 2-3x
  # over their own CPU limit on busy nodes. See worker.NewRuntime.
  CONTAINER_RUNTIME: "crictl"
  # Node path of the containerd socket (resolved inside the node's root,
  # so no hostPath mount is needed for it).
  CONTAINER_RUNTIME_ENDPOINT: "unix:///run/containerd/containerd.sock"
  # crictl/ctr are the node's own binaries, run chrooted into the node's
  # root. /proc/1/root works with hostPID + privileged; no volume needed.
  HOST_ROOT: "/proc/1/root"
  # Path to a mounted dockerconfigjson secret (same format imagePullSecrets
  # uses) so preheat pulls can authenticate to private registries — the
  # worker's own pull mechanism bypasses kubelet's CRI plumbing entirely,
  # so kubelet's imagePullSecrets never apply to it otherwise. Leave unset
  # to pull anonymously (fine for public images only).
  REGISTRY_CREDENTIALS_PATH: "/etc/angryduck/registry-creds/.dockerconfigjson"

  # --- Pod rescue (see .env.example for the full story) ---
  # Not P2P, not a standing mirror: only fires for a pod already stuck in
  # ImagePullBackOff/ErrImagePull. Asks the controller for AT MOST ONE
  # node that already has the exact image, makes exactly ONE attempt to
  # copy it from there, and on failure goes quiet for
  # RESCUE_RETRY_INTERVAL_S instead of retrying — no busy-peer loop, no
  # fan-out, no continuous interception of every pull the way the old
  # mirror worked. Needs the RBAC in rbac.yaml. No allowlist gates which
  # images this applies to — watch angryduck_worker_rescue_attempts_total
  # and the WARN logs instead.
  RESCUE_ENABLED: "true"
  RESCUE_POLL_INTERVAL_S: "30"
  # How long to wait before retrying a rescue that just failed (no source
  # anywhere, transfer failed, ...). This is the entire retry policy —
  # there is no internal retry loop, so this is the only thing standing
  # between "tried once" and "tried again."
  RESCUE_RETRY_INTERVAL_S: "600"
  # At most this many /rescue-export requests run at once on one node.
  # Rescue is a rare, occasional repair path, not a throughput mechanism,
  # so this deliberately stays small (see the resources comment in
  # worker-daemonset.yaml for the memory math this implies).
  RESCUE_MAX_CONCURRENT_EXPORTS: "1"
  # kyverno-test and k8sgpt-demo run pods with deliberately broken images
  # (policy/diagnostic-tool testing) that have been stuck indefinitely —
  # first rollout showed these logging identically on every node, every
  # poll, forever. Add more here as other permanent test/demo namespaces
  # turn up.
  RESCUE_EXCLUDE_NAMESPACE_SUBSTRINGS: "kyverno-test,k8sgpt-demo"
  # RESCUE_PEER_TOKEN comes from the angryduck-rescue Secret, not here.

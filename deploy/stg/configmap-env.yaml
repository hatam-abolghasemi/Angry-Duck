apiVersion: v1
kind: ConfigMap
metadata:
  name: angryduck-config
  namespace: angryduck
  labels:
    app.kubernetes.io/env: stg
    app.kubernetes.io/name: angryduck
data:
  LOG_LEVEL: "info"
  METRICS_LABEL_REGISTRY: "true"
  SPEGEL_IMAGE_SUBSTRING: "spegel"
  CONTROLLER_LISTEN_ADDR: ":8080"
  WORKER_STALE_AFTER_S: "30"
  TARGET_TTL_S: "120"
  RANK_INTERVAL_S: "10"
  RANK_TOP_N: "5"
  RANK_PREFER_IMAGE_LOCALITY: "true"
  RANK_EXCLUDE_NODE_SUBSTRINGS: "master,control-plane"
  WORKER_LISTEN_ADDR: ":18081"
  NODE_EXPORTER_URL: "http://localhost:9100/metrics"
  CONTROLLER_URL: "http://angryduck-controller.angryduck.svc.cluster.local:8080"
  REPORT_INTERVAL_S: "15"
  PREHEAT_ATTRIBUTION_INTERVAL_S: "300"
  PREHEAT_ATTRIBUTION_RETENTION_S: "3600"
  GC_CHECK_INTERVAL_S: "60"
  GC_MISS_THRESHOLD: "5"
  GC_GRACE_PERIOD_S: "60"
  GC_DRY_RUN: "false"
  GC_EXCLUDE_IMAGE_SUBSTRINGS: "repo-sahand.internal-dev.example.com/pause:3.10"
  CONTAINER_RUNTIME: "crictl"
  CONTAINER_RUNTIME_ENDPOINT: "unix:///run/containerd/containerd.sock"
  HOST_ROOT: "/proc/1/root"
  REGISTRY_CREDENTIALS_PATH: "/etc/angryduck/registry-creds/.dockerconfigjson"
  RESCUE_ENABLED: "true"
  RESCUE_POLL_INTERVAL_S: "30"
  RESCUE_RETRY_INTERVAL_S: "600"
  RESCUE_MAX_CONCURRENT_EXPORTS: "1"
  RESCUE_EXCLUDE_NAMESPACE_SUBSTRINGS: "kyverno-test,k8sgpt-demo"
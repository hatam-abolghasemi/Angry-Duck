apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: angryduck-worker
  namespace: angryduck
  labels:
    app: angryduck-worker
spec:
  selector:
    matchLabels:
      app: angryduck-worker
  template:
    metadata:
      labels:
        app: angryduck-worker
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: gitlab-docker-registry
      containers:
        - name: worker
          image: registry.internal-registry.example.com/devops/generic/angry-duck-worker:1.3.0
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SELF_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Shared by every worker; peers present it to each other's
            # /export. optional: the worker starts without it and just
            # logs "MIRROR DISABLED" until the Secret exists.
            - name: MIRROR_PEER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: angryduck-mirror
                  key: token
                  optional: true
          envFrom:
            - configMapRef:
                name: angryduck-config
          ports:
            - containerPort: 18081
              name: http
          volumeMounts:
            # No containerd socket or binary mounts: crictl/ctr run
            # chrooted into /proc/1/root and see the node's own socket.
            - name: registry-creds
              mountPath: /etc/angryduck/registry-creds
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # Idle usage is unchanged: the worker itself is ~6 MiB, and the
            # periodic crictl call (~20 MiB, a child in this cgroup) is
            # what the old ~20-40Mi observation mostly was.
            # Limits are for peer transfers: each ctr export/import child
            # peaks at ~30-35 MiB and needs ~5 ms CPU per MiB moved.
            # Worst case = worker 6 + 2 exports 62 + 2 imports 68 + crictl
            # listing 20 + preheat crictl pull 25 ~= 181 MiB. At the old
            # 200m CPU a 150 MiB image took >=3.8 s of throttled CPU per
            # side (~40 MiB/s) — slower than the LAN it rides on.
            # Requests stay low: limits reserve nothing.
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 192Mi
          securityContext:
            privileged: true
      volumes:
        - name: registry-creds
          secret:
            secretName: gitlab-registry-pull
      tolerations:
        - operator: Exists

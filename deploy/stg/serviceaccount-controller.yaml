# The controller's rescuer lists Pending pods cluster-wide to find ones
# stuck in ImagePullBackOff. That read is the only Kubernetes API access
# Angry Duck has. It never creates, patches or deletes anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: angryduck-controller
  namespace: angryduck
  labels:
    app.kubernetes.io/env: stg
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: angryduck-controller
  labels:
    app.kubernetes.io/env: stg
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: angryduck-controller
  labels:
    app.kubernetes.io/env: stg
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: angryduck-controller
subjects:
  - kind: ServiceAccount
    name: angryduck-controller
    namespace: angryduck

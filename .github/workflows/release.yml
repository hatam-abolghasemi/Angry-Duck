name: Release

# Push a tag vX.Y.Z (matching helm/angryduck/Chart.yaml's appVersion and a
# "## X.Y.Z" section in CHANGELOG.md) and this builds and pushes both images
# to ghcr.io as X.Y.Z and latest, then publishes the GitHub release with
# that CHANGELOG section as its notes.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.8.12"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - name: Tag, chart and changelog agree
        run: |
          v="${{ steps.v.outputs.version }}"
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' helm/angryduck/Chart.yaml)
          [ "$app" = "$v" ] || { echo "::error::Chart.yaml appVersion is $app, tag is $v"; exit 1; }
          grep -q "^## ${v}\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${v}' section"; exit 1; }
          for f in k8s/daemonset-worker.yaml k8s/deployment-controller.yaml; do
            grep -q ":${v}\$" "$f" || { echo "::error::$f doesn't use image tag ${v}"; exit 1; }
          done

  images:
    name: Image ${{ matrix.component }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [controller, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: echo "name=${REGISTRY}/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/angry-duck-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.prepare.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release:
    name: GitHub release
    needs: [prepare, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v v="## ${VERSION}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Angry Duck ${VERSION}" --notes-file notes.md
          else
            gh release create "$TAG" --title "Angry Duck ${VERSION}" --notes-file notes.md --verify-tag
          fi

name: Release

# Push a tag vX.Y.Z (annotated, its message is the title after the dash):
#   git tag -a v1.8.14 -m "short description" && git push origin v1.8.14
# Or rerun for an existing tag: Actions -> Release -> Run workflow.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v1.8.13"
        required: true
      title:
        description: "Title after the dash (default: the tag's message)"
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: hatam-abolghasemi

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}
      - name: Tag, chart and changelog agree
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' helm/angryduck/Chart.yaml)
          chart=$(sed -n 's/^version: *//p' helm/angryduck/Chart.yaml)
          [ "$app" = "$V" ] || { echo "::error::Chart.yaml appVersion is $app, tag is $V"; exit 1; }
          [ "$chart" = "$V" ] || { echo "::error::Chart.yaml version is $chart, tag is $V"; exit 1; }
          grep -q "^## ${V}\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${V}' section"; exit 1; }
          for f in k8s/daemonset-worker.yaml k8s/deployment-controller.yaml; do
            grep -q ":${V}\$" "$f" || { echo "::error::$f doesn't use image tag ${V}"; exit 1; }
          done

  images:
    name: Image ${{ matrix.component }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [controller, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/angry-duck-${{ matrix.component }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/angry-duck-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  chart:
    name: Helm chart
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: azure/setup-helm@v4
      - name: Push chart to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          V: ${{ needs.prepare.outputs.version }}
        run: |
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin
          helm package helm/angryduck -d dist
          helm push "dist/angryduck-${V}.tgz" "oci://${REGISTRY}/${OWNER}/charts"

  release:
    name: GitHub release
    needs: [prepare, images, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Title and notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          V: ${{ needs.prepare.outputs.version }}
          TITLE: ${{ github.event.inputs.title }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ -z "$TITLE" ]; then
            TITLE=$(git tag -l --format='%(contents:subject)' "$TAG")
            case "$TITLE" in "Angry Duck"*|"$TAG"|"$V") TITLE="" ;; esac
          fi
          if [ -n "$TITLE" ]; then echo "TITLE=$TAG — $TITLE" >> "$GITHUB_ENV"; else echo "TITLE=$TAG" >> "$GITHUB_ENV"; fi
          python3 - <<'PY' > notes.md
          import os, re
          v, tag, repo = os.environ["V"], os.environ["TAG"], os.environ["REPO_URL"]
          text = open("CHANGELOG.md").read()
          sec = text.split(f"\n## {v}\n", 1)[1].split("\n## ", 1)[0].strip("\n")
          out, cur = [], ""
          for line in sec.split("\n"):
              if not line.strip():
                  if cur: out.append(cur); cur = ""
                  out.append("")
              elif line.startswith("#") or re.match(r"^\s*- ", line):
                  if cur: out.append(cur)
                  cur = line.rstrip()
              else:
                  cur = f"{cur} {line.strip()}" if cur else line.rstrip()
          if cur: out.append(cur)
          body = re.sub(r"\n{3,}", "\n\n", "\n".join(out)).strip()
          body = body.replace("](docs/", f"]({repo}/blob/{tag}/docs/")
          owner = "hatam-abolghasemi"
          fence = "`" * 3
          print(body)
          print()
          print("Images:")
          print()
          print(fence)
          print(f"ghcr.io/{owner}/angry-duck-controller:{v}")
          print(f"ghcr.io/{owner}/angry-duck-worker:{v}")
          print(fence)
          print()
          print(f"Helm chart: [`oci://ghcr.io/{owner}/charts/angryduck`]({repo}/tree/{tag}/helm/angryduck) (version {v}):")
          print()
          print(fence)
          print(f"helm upgrade --install angryduck oci://ghcr.io/{owner}/charts/angryduck --version {v} --namespace angryduck --create-namespace -f my-values.yaml")
          print(fence)
          PY
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md --latest --verify-tag
          fi

name: pprof images

# Debug images with Go's /debug/pprof/ built in, for live profiling:
#   Actions -> pprof images -> Run workflow, version e.g. 1.13.2
# Builds tag v<version>'s source into angry-duck-{controller,worker}:<version>-pprof.
# Release images and `latest` are untouched. Serve the endpoints with
# DEBUG_PPROF_ADDR (see docs/development.md, Profiling).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to build, e.g. 1.13.2"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: pprof-${{ github.event.inputs.version }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: hatam-abolghasemi

jobs:
  images:
    name: Image ${{ matrix.component }}-pprof
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Release tags + pprof: the profiled binary is the released one.
          - component: controller
            tags: pprof
          - component: worker
            tags: grpcnotrace pprof
    steps:
      - name: Check version
        env:
          V: ${{ github.event.inputs.version }}
        run: |
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$V is not X.Y.Z"; exit 1; }

      # This ref: pprof.Dockerfile. The tag: the source to build.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - uses: actions/checkout@v7
        with:
          ref: v${{ github.event.inputs.version }}
          path: tag

      - name: Base images from the tag's Dockerfile
        id: base
        env:
          F: tag/app/Dockerfile.${{ matrix.component }}
        run: |
          go=$(awk '/^FROM .* AS build$/ {print $(NF-2)}' "$F")
          rt=$(awk '/^FROM / {img=$NF} END {print img}' "$F")
          [ -n "$go" ] && [ -n "$rt" ] || { echo "::error::can't read base images from $F"; exit 1; }
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "runtime=$rt" >> "$GITHUB_OUTPUT"
          echo "build: $go, runtime: $rt"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: tag/app
          file: .github/pprof.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            GO_IMAGE=${{ steps.base.outputs.go }}
            RUNTIME_IMAGE=${{ steps.base.outputs.runtime }}
            COMPONENT=${{ matrix.component }}
            GO_TAGS=${{ matrix.tags }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/angry-duck-${{ matrix.component }}:${{ github.event.inputs.version }}-pprof
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.inputs.version }}-pprof

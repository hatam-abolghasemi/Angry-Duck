version: 2
updates:
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

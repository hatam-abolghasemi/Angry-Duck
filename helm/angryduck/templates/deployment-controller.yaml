apiVersion: apps/v1
kind: Deployment
metadata:
  name: angryduck-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: angryduck
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: angryduck
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: angryduck
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: angryduck-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_NAME # labels angryduck_build_info
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - configMapRef:
                name: angryduck-config
          volumeMounts:
            - name: registry-creds
              mountPath: /etc/angryduck/registry-creds
              readOnly: true
            - name: rescue-token
              mountPath: /etc/angryduck/rescue-token
              readOnly: true
            - name: webhook-token
              mountPath: /etc/angryduck/webhook-token
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: registry-creds
          secret:
            secretName: {{ .Values.registryCredentials.secretName }}
            {{- if .Values.registryCredentials.optional }}
            optional: true
            {{- end }}
        - name: rescue-token
          secret:
            secretName: angryduck-rescue-token
            optional: true
        - name: webhook-token
          secret:
            secretName: angryduck-webhook-token
            optional: true
